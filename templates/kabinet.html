<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O‘quvchi Shaxsiy Kabineti | Qorako‘l Ziyo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        const userInfo = JSON.parse(sessionStorage.getItem("user_info") || "null");
        if (!userInfo || !userInfo.id) {
            window.location.href = "/login";
        }
        function chiqish() {
            sessionStorage.removeItem("user_info");
            window.location.href = "/login";
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 100%); color: #1e293b; min-height: 100vh; padding-bottom: 50px; }
        .header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; }
        .logo { font-weight: 800; font-size: 18px; color: #4338ca; }
        .nav-links { display: flex; align-items: center; gap: 15px; }
        .nav-link { text-decoration: none; color: #475569; font-weight: 700; font-size: 14px; }
        .btn-exit { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .user-welcome-card { background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); color: white; border-radius: 20px; padding: 28px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .user-welcome-card h1 { font-size: 22px; font-weight: 800; }
        .filter-bar { background: white; padding: 16px 20px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; }
        .filter-bar select { padding: 10px 16px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; font-weight: 700; outline: none; }
        .section-title { font-size: 19px; font-weight: 800; color: #1e1b4b; margin-bottom: 16px; }
        .tests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; margin-bottom: 35px; }
        .test-box { background: white; border-radius: 16px; padding: 22px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between; }
        .tb-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .tb-title { font-size: 16px; font-weight: 800; color: #0f172a; }
        .badge { padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        .badge-kunlik { background: #e0f2fe; color: #0369a1; }
        .badge-haftalik { background: #fef3c7; color: #b45309; }
        .badge-oylik { background: #dcfce7; color: #15803d; }
        .tb-info { font-size: 13px; color: #64748b; margin-bottom: 18px; display: flex; flex-direction: column; gap: 4px; }
        .btn-action { width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; text-align: center; border: none; cursor: pointer; text-decoration: none; display: block; }
        .btn-start { background: #4f46e5; color: white; }
        .btn-done { background: #e0e7ff; color: #4338ca; }
        .timer-box { background: #fffbeb; color: #b45309; padding: 10px 14px; border-radius: 10px; font-weight: 800; font-size: 14px; text-align: center; border: 1.5px dashed #f59e0b; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-box { background: white; border-radius: 20px; padding: 30px; max-width: 700px; width: 90%; max-height: 85vh; overflow-y: auto; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">🎓 Qorako‘l Ziyo | O‘quvchi Portali</div>
        <div class="nav-links">
            <a href="/reyting" class="nav-link">🏆 Reyting</a>
            <a href="/aloqa" class="nav-link">📞 Aloqa</a>
            <button class="btn-exit" onclick="chiqish()">🚪 Chiqish</button>
        </div>
    </header>

    <div class="container">

        <div class="user-welcome-card">
            <div>
                <h1 id="userFio">Xush kelibsiz!</h1>
                <p id="userMaktab">Viloyat | Maktab | Sinf</p>
            </div>
            <div style="background: rgba(255,255,255,0.15); padding: 10px 18px; border-radius: 12px; font-weight: 700;">
                ID: #<span id="userId">-</span>
            </div>
        </div>

        <div class="filter-bar">
            <span style="font-weight: 800; font-size: 14px; color: #3730a3;">📚 Fan tanlang:</span>
            <select id="fanFilter" onchange="yuklashTestlar()">
                <option value="barchasi">Barcha fanlar</option>
                <option value="Informatika">Informatika</option>
                <option value="Matematika">Matematika</option>
                <option value="Fizika">Fizika</option>
            </select>
        </div>

        <div class="section-title">⚡ Foydalanish mumkin bo‘lgan Testlar va Olimpiadalar</div>
        <div class="tests-grid" id="testsContainer">
            <p style="color: #64748b;">Testlar yuklanmoqda...</p>
        </div>

        <div class="section-title">📊 Mening Avvalgi Natijalarim</div>
        <div style="background: white; border-radius: 16px; border: 1px solid #e2e8f0; overflow-x: auto; padding: 15px;">
            <table style="width: 100%; border-collapse: collapse; min-width: 600px; font-size: 14px;">
                <thead>
                    <tr style="border-bottom: 2px solid #f1f5f9; text-align: left; color: #64748b;">
                        <th style="padding: 12px;">Fan</th>
                        <th>Bosqich</th>
                        <th>Davr</th>
                        <th>Ball</th>
                        <th>O‘rin</th>
                        <th>Sana</th>
                    </tr>
                </thead>
                <tbody id="natijalarTable"></tbody>
            </table>
        </div>

    </div>

    <!-- SAVOLLAR VA XATOLAR TAHLILI MODALI -->
    <div class="modal" id="tahlilModal">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: #4338ca;">🔍 Test Savollari va Xatolar Tahlili</h3>
                <button onclick="document.getElementById('tahlilModal').style.display='none'" style="border: none; background: #fee2e2; color: #dc2626; padding: 6px 12px; border-radius: 8px; font-weight: 800; cursor: pointer;">✕ Yopish</button>
            </div>
            <div id="tahlilSavollarJoyi"></div>
        </div>
    </div>

    <script>
        document.getElementById("userFio").innerText = `Salom, ${userInfo.fio}!`;
        document.getElementById("userMaktab").innerText = `${userInfo.viloyat || ''} | ${userInfo.maktab || ''} | ${userInfo.sinf}-sinf`;
        document.getElementById("userId").innerText = userInfo.id;

        async function yuklashTestlar() {
            const container = document.getElementById("testsContainer");
            const fan = document.getElementById("fanFilter").value;
            const fanParam = fan === "barchasi" ? "" : `&fan=${encodeURIComponent(fan)}`;

            try {
                const res = await fetch(`/api/testlar/royxat?sinf=${userInfo.sinf}&oquvchi_id=${userInfo.id}${fanParam}`);
                const data = await res.json();
                const testlar = data.testlar || [];

                if (testlar.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1/-1; padding: 30px; text-align: center; color: #94a3b8; background: white; border-radius: 16px;">Hozircha testlar mavjud emas.</div>`;
                    return;
                }

                container.innerHTML = testlar.map(t => {
                    let tugma = "";

                    if (t.ishlangan) {
                        tugma = `
                            <div class="btn-action btn-done" style="margin-bottom: 6px;">✅ Ishlangan: ${t.toplagan_ball} ball</div>
                            ${t.javoblar_ochiq ? `
                                <button onclick="korishTahlil(\${t.id})" style="width: 100%; background: #059669; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer;">
                                    👁️ Xatolar Tahlilini Ko‘rish
                                </button>
                            ` : ''}
                        `;
                    } else if (t.holat === "kutilmoqda" && t.boshlanish_vaqti) {
                        tugma = `
                            <div class="timer-box" id="taymer-quti-${t.id}">
                                ⏳ Boshlanishiga: <br>
                                <span class="vaqt-sanoq" data-vaqt="${t.boshlanish_vaqti}" data-id="${t.id}" style="font-size: 16px; font-weight: 800; color: #d97706;">Hisoblanmoqda...</span>
                            </div>
                        `;
                    } else if (!t.tolangan && t.narxi > 0) {
                        tugma = `<button onclick="alert('To‘lov qilinishi lozim!')" class="btn-action" style="background:#059669; color:white;">💳 To‘lov qilish (${t.narxi} so‘m)</button>`;
                    } else {
                        tugma = `<a href="/test/${t.id}" class="btn-action btn-start">🚀 Testni Boshlash</a>`;
                    }

                    return `
                        <div class="test-box">
                            <div>
                                <div class="tb-header">
                                    <span class="badge badge-${t.turi}">${t.turi}</span>
                                    <span style="font-size: 13px; font-weight: 700; color: #4338ca;">${t.fan}</span>
                                </div>
                                <div class="tb-title">${t.nomi}</div>
                                <div class="tb-info">
                                    <span>⏱️ Vaqt: ${t.davomiyligi_daqiqa} daqiqa (25 ta savol)</span>
                                    <span>💰 Narxi: ${t.narxi > 0 ? t.narxi + " so‘m" : "Bepul"}</span>
                                </div>
                            </div>
                            <div id="amal-joyi-${t.id}">
                                ${tugma}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) { container.innerHTML = `<p style="color:red;">Aloqa xatosi!</p>`; }
        }

        // TAHLILNI KO'RISH
        async function korishTahlil(testId) {
            try {
                const res = await fetch(`/api/oquvchi/test_tahlil/${testId}/${userInfo.id}`);
                const data = await res.json();
                if (!res.ok) return alert(data.xatolik || "Xatolik!");

                const box = document.getElementById("tahlilSavollarJoyi");
                box.innerHTML = data.savollar.map((s, i) => `
                    <div style="background: ${s.togrimi ? '#f0fdf4' : '#fef2f2'}; border: 1.5px solid ${s.togrimi ? '#bbf7d0' : '#fecaca'}; border-radius: 12px; padding: 14px; margin-bottom: 12px;">
                        <b style="color: #1e1b4b;">${i + 1}. ${s.savol_matni}</b>
                        <div style="margin-top: 8px; font-size: 13px; font-weight: 700;">
                            Siz tanlagan: <span style="color: ${s.togrimi ? '#16a34a' : '#dc2626'}; font-size: 15px;">${s.belgilangan}</span> | 
                            To‘g‘ri javob: <span style="color: #16a34a; font-size: 15px;">${s.togri_javob}</span>
                        </div>
                    </div>
                `).join('');

                document.getElementById("tahlilModal").style.display = "flex";
            } catch(e) { alert("Tahlilni yuklab bo‘lmadi!"); }
        }

        // TAYMER
        setInterval(() => {
            document.querySelectorAll(".vaqt-sanoq").forEach(el => {
                const vaqtStr = el.getAttribute("data-vaqt");
                const testId = el.getAttribute("data-id");
                if (!vaqtStr) return;
                const oraliq = new Date(vaqtStr).getTime() - new Date().getTime();
                if (oraliq <= 0) {
                    const amalQuti = document.getElementById(`amal-joyi-${testId}`);
                    if (amalQuti) amalQuti.innerHTML = `<a href="/test/${testId}" class="btn-action btn-start">🚀 Testni Boshlash</a>`;
                } else {
                    const s = Math.floor((oraliq % (1000 * 60 * 60)) / (1000 * 60));
                    const son = Math.floor((oraliq % (1000 * 60)) / 1000);
                    el.innerText = `${String(Math.floor(oraliq / (1000 * 60 * 60))).padStart(2, '0')}:${String(s).padStart(2, '0')}:${String(son).padStart(2, '0')}`;
                }
            });
        }, 1000);

        async function yuklashNatijalar() {
            const res = await fetch(`/api/oquvchi_natijalari/${userInfo.id}`);
            const data = await res.json();
            const tbody = document.getElementById("natijalarTable");
            if (!data.tarix || data.tarix.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="padding: 15px; text-align: center; color: #94a3b8;">Hali natijalar yo‘q</td></tr>`;
                return;
            }
            tbody.innerHTML = data.tarix.map(n => `
                <tr style="border-bottom: 1px solid #f1f5f9;">
                    <td style="padding: 12px; font-weight: 700; color: #3730a3;">${n.fan}</td>
                    <td style="text-transform: capitalize;">${n.bosqich_turi}</td>
                    <td>${n.oy_nomi}</td>
                    <td style="font-weight: 800; color: #16a34a;">${n.ball} ball</td>
                    <td><span style="background: #eef2ff; color: #4338ca; padding: 3px 8px; border-radius: 6px; font-weight: 700;">${n.orin}-o‘rin</span></td>
                    <td style="color: #64748b; font-size: 12px;">${n.sana ? n.sana.slice(0, 10) : '-'}</td>
                </tr>
            `).join('');
        }

        yuklashTestlar();
        yuklashNatijalar();
    </script>
</body>
</html>
