<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Boshqaruv Markazi | Qorako‘l Ziyo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        const adminToken = sessionStorage.getItem("admin_token");
        if (!adminToken) {
            window.location.href = "/admin-login";
        }
        function chiqish() {
            sessionStorage.removeItem("admin_token");
            window.location.href = "/admin-login";
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding-bottom: 60px; }
        .header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; }
        .logo { font-weight: 800; font-size: 18px; color: #38bdf8; }
        .btn-exit { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media(max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }
        
        .card { background: #1e293b; border-radius: 20px; padding: 25px; border: 1px solid #334155; margin-bottom: 25px; }
        h2 { font-size: 18px; font-weight: 800; color: #38bdf8; margin-bottom: 15px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; font-weight: 700; color: #94a3b8; }
        input, select { padding: 10px 14px; border-radius: 10px; border: 1.5px solid #475569; background: #0f172a; color: white; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        .btn-add { background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; width: 100%; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th { background: #334155; color: #e2e8f0; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #334155; color: #cbd5e1; }
        .btn-action-sm { padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; font-size: 12px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">⚡ Super Admin Boshqaruv Markazi</div>
        <button class="btn-exit" onclick="chiqish()">Chiqish</button>
    </header>

    <div class="container">

        <!-- 1. KUTILAYOTGAN TO'LOVLARNI TASDIQLASH -->
        <div class="card" style="border: 2px solid #38bdf8;">
            <h2 style="color: #38bdf8;">💳 Kutilayotgan To‘lovlar va Cheklar</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>O‘quvchi</th>
                            <th>Telefon</th>
                            <th>Test Nomi</th>
                            <th>Summa</th>
                            <th>Chek Rasmi</th>
                            <th>Amal</th>
                        </tr>
                    </thead>
                    <tbody id="tolovlarTbody">
                        <tr><td colspan="6" style="text-align: center; color: #94a3b8;">Yuklanmoqda...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="grid-2">
            <!-- 2. IMTIHON E'LON QILISH -->
            <div class="card">
                <h2>📢 Kelgusi Imtihon E'lon Qilish</h2>
                <form onsubmit="qoshishImtihon(event)">
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label>Imtihon nomi:</label>
                        <input type="text" id="i_nomi" placeholder="Masalan: Viloyat saralash bosqichi" required>
                    </div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Fani:</label>
                            <select id="i_fan">
                                <option value="Informatika">Informatika</option>
                                <option value="Matematika">Matematika</option>
                                <option value="Fizika">Fizika</option>
                                <option value="Kimyo">Kimyo</option>
                                <option value="Biologiya">Biologiya</option>
                                <option value="Ingliz tili">Ingliz tili</option>
                                <option value="Ona tili">Ona tili va adabiyot</option>
                                <option value="Tarix">Tarix</option>
                                <option value="Geografiya">Geografiya</option>
                                <option value="Huquq">Huquq</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Sinf:</label>
                            <input type="text" id="i_sinf" placeholder="Masalan: 5-11" required>
                        </div>
                        <div class="input-group">
                            <label>Boshlanish vaqti:</label>
                            <input type="datetime-local" id="i_vaqt" required>
                        </div>
                        <div class="input-group">
                            <label>Manzil:</label>
                            <input type="text" id="i_manzil" placeholder="Masalan: 1-IDUM binosi" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-add">E'lon Qilish</button>
                </form>
            </div>

            <!-- 3. O'QITUVCHI QO'SHISH -->
            <div class="card">
                <h2>👨‍🏫 Yangi Ustoz Biriktirish</h2>
                <form onsubmit="qoshishOqituvchi(event)">
                    <div class="input-group" style="margin-bottom: 12px;">
                        <label>O‘qituvchi F.I.O:</label>
                        <input type="text" id="o_fio" required>
                    </div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Fani:</label>
                            <select id="o_fan">
                                <option value="Informatika">Informatika</option>
                                <option value="Matematika">Matematika</option>
                                <option value="Fizika">Fizika</option>
                                <option value="Kimyo">Kimyo</option>
                                <option value="Biologiya">Biologiya</option>
                                <option value="Ingliz tili">Ingliz tili</option>
                                <option value="Ona tili">Ona tili va adabiyot</option>
                                <option value="Tarix">Tarix</option>
                                <option value="Geografiya">Geografiya</option>
                                <option value="Huquq">Huquq</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Telefon:</label>
                            <input type="text" id="o_tel" placeholder="901234567">
                        </div>
                        <div class="input-group">
                            <label>Login:</label>
                            <input type="text" id="o_login" required>
                        </div>
                        <div class="input-group">
                            <label>Parol:</label>
                            <input type="text" id="o_parol" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-add" style="background: #34d399;">Ustozni Saqlash</button>
                </form>
            </div>
        </div>

        <!-- 4. IMTIHONLAR RO'YXATI -->
        <div class="card">
            <h2>📋 Faol Imtihonlar</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead><tr><th>Nomi</th><th>Fan</th><th>Sinf</th><th>Vaqti</th><th>Manzil</th><th>Amal</th></tr></thead>
                    <tbody id="imtihonlarTbody"></tbody>
                </table>
            </div>
        </div>

        <!-- 5. O'QITUVCHILAR RO'YXATI -->
        <div class="card">
            <h2>👥 O‘qituvchilar Ro‘yxati</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead><tr><th>F.I.O</th><th>Fani</th><th>Login</th><th>Parol</th><th>Telefon</th><th>Amal</th></tr></thead>
                    <tbody id="oqituvchilarTbody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // KUTILAYOTGAN CHEKLARNI OLISH
        async function yuklashTolovlar() {
            try {
                const res = await fetch("/api/admin/kutilayotgan_tolovlar");
                const data = await res.json();
                const tbody = document.getElementById("tolovlarTbody");
                
                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 15px;">Hozircha kutilayotgan to‘lov cheklari yo‘q.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(t => `
                    <tr>
                        <td style="font-weight: 700; color: white;">${t.fio}</td>
                        <td>${t.telefon}</td>
                        <td style="color: #38bdf8;">${t.test_nomi}</td>
                        <td style="font-weight: 800; color: #34d399;">${t.summa} so‘m</td>
                        <td>
                            <a href="${t.chek_rasm}" target="_blank" style="color: #38bdf8; text-decoration: underline; font-weight: 700;">
                                🔍 Chekni ko‘rish
                            </a>
                        </td>
                        <td>
                            <button onclick="tasdiqlashTolov(${t.id})" class="btn-action-sm" style="background: #10b981; color: white;">
                                ✅ Tasdiqlash
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch(e) { console.error(e); }
        }

        // TO'LOVNI TASDIQLASH VA TESTNI OCHISH
        async function tasdiqlashTolov(tolovId) {
            if (!confirm("Ushbu to‘lovni tasdiqlaysizmi? O‘quvchiga test ochiladi.")) return;
            try {
                const res = await fetch(`/api/admin/tolov_tasdiqlash/${tolovId}?holat=tasdiqlandi`, { method: "PUT" });
                const d = await res.json();
                alert(d.xabar);
                yuklashTolovlar();
            } catch(e) { alert("Xatolik!"); }
        }

        async function yuklashImtihonlar() {
            const res = await fetch("/api/admin/imtihonlar");
            const data = await res.json();
            document.getElementById("imtihonlarTbody").innerHTML = data.map(i => `
                <tr>
                    <td><b>${i.nomi}</b></td>
                    <td>${i.fan}</td>
                    <td>${i.sinf}</td>
                    <td>${i.boshlanish_vaqti}</td>
                    <td>${i.manzil}</td>
                    <td><button onclick="ochirishImtihon(${i.id})" class="btn-action-sm" style="background:#ef4444; color:white;">O‘chirish</button></td>
                </tr>
            `).join('');
        }

        async function yuklashOqituvchilar() {
            const res = await fetch("/api/admin/oqituvchilar");
            const data = await res.json();
            document.getElementById("oqituvchilarTbody").innerHTML = data.map(o => `
                <tr>
                    <td><b>${o.fio}</b></td>
                    <td>${o.fan}</td>
                    <td>${o.login}</td>
                    <td>${o.parol}</td>
                    <td>${o.telefon || '-'}</td>
                    <td><button onclick="ochirishOqituvchi(${o.id})" class="btn-action-sm" style="background:#ef4444; color:white;">O‘chirish</button></td>
                </tr>
            `).join('');
        }

        async function qoshishImtihon(e) {
            e.preventDefault();
            const res = await fetch("/api/admin/imtihon_qoshish", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nomi: document.getElementById("i_nomi").value,
                    fan: document.getElementById("i_fan").value,
                    sinf: document.getElementById("i_sinf").value,
                    boshlanish_vaqti: document.getElementById("i_vaqt").value,
                    manzil: document.getElementById("i_manzil").value
                })
            });
            const d = await res.json();
            alert(d.xabar);
            yuklashImtihonlar();
        }

        async function qoshishOqituvchi(e) {
            e.preventDefault();
            const res = await fetch("/api/admin/oqituvchi_qoshish", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    fio: document.getElementById("o_fio").value,
                    fan: document.getElementById("o_fan").value,
                    login: document.getElementById("o_login").value,
                    parol: document.getElementById("o_parol").value,
                    telefon: document.getElementById("o_tel").value
                })
            });
            const d = await res.json();
            alert(d.xabar || d.xatolik);
            yuklashOqituvchilar();
        }

        async function ochirishImtihon(id) {
            if (!confirm("Imtihon o‘chirilsinmi?")) return;
            const res = await fetch(`/api/admin/imtihon_ochirish/${id}`, { method: "DELETE" });
            const d = await res.json();
            alert(d.xabar);
            yuklashImtihonlar();
        }

        async function ochirishOqituvchi(id) {
            if (!confirm("O‘qituvchi tizimdan o‘chirilsinmi?")) return;
            const res = await fetch(`/api/admin/oqituvchi_ochirish/${id}`, { method: "DELETE" });
            const d = await res.json();
            alert(d.xabar);
            yuklashOqituvchilar();
        }

        yuklashTolovlar();
        yuklashImtihonlar();
        yuklashOqituvchilar();
    </script>
</body>
</html>
