<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bog‘lanish va Qo‘llab-quvvatlash | Qorako‘l Ziyo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 100%); color: #1e293b; min-height: 100vh; padding-bottom: 50px; }
        .header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; }
        .logo { font-weight: 800; font-size: 18px; color: #4338ca; text-decoration: none; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 24px; padding: 35px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.05); }
        h1 { font-size: 24px; font-weight: 800; color: #1e1b4b; margin-bottom: 10px; }
        p { color: #64748b; font-size: 15px; margin-bottom: 25px; line-height: 1.6; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 650px) { .contact-grid { grid-template-columns: 1fr; } }
        .contact-item { border: 1.5px solid #e2e8f0; border-radius: 18px; padding: 22px; display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit; transition: 0.2s; background: #f8fafc; }
        .contact-item:hover { border-color: #6366f1; background: #eef2ff; transform: translateY(-2px); }
        .icon-box { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .c-title { font-size: 13px; font-weight: 700; color: #64748b; }
        .c-value { font-size: 16px; font-weight: 800; color: #1e1b4b; margin-top: 4px; }
    </style>
</head>
<body>

    <header class="header">
        <a href="/" class="logo">⚡ Qorako‘l Ziyo</a>
        <a href="/kabinet" style="text-decoration: none; background: #eef2ff; color: #4338ca; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 13px;">🎓 Kabinetga Qaytish</a>
    </header>

    <div class="container">
        <div class="card">
            <h1>📞 Biz bilan bog‘lanish</h1>
            <p>Platformadan foydalanish, olimpiadalar yoki to‘lovlar bo‘yicha savollaringiz bo‘lsa, to‘g‘ridan-to‘g‘ri ma'muriyat bilan bog‘lanishingiz mumkin:</p>

            <div class="contact-grid">
                <!-- TELEGRAM ADMIN -->
                <a href="https://t.me/yozilov_madiyor" target="_blank" class="contact-item">
                    <div class="icon-box" style="background: #e0f2fe; color: #0284c7;">✈️</div>
                    <div>
                        <div class="c-title">Telegram Admin</div>
                        <div class="c-value">@yozilov_madiyor</div>
                    </div>
                </a>

                <!-- ISHONCH TELEFONI -->
                <a href="tel:+998913080637" class="contact-item">
                    <div class="icon-box" style="background: #dcfce7; color: #16a34a;">📞</div>
                    <div>
                        <div class="c-title">Ishonch telefoni</div>
                        <div class="c-value">+998 91 308-06-37</div>
                    </div>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
