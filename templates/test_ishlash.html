<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onlayn Test Sinovi | Qorako‘l Ziyo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        
        .test-header {
            background: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            padding: 14px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .test-title { font-weight: 800; font-size: 16px; color: #1e1b4b; }
        
        .timer-badge {
            background: #fef2f2;
            color: #dc2626;
            border: 1.5px solid #fecaca;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            margin: 25px auto;
            padding: 0 20px;
            flex: 1;
        }
        @media (max-width: 850px) {
            .main-wrapper { grid-template-columns: 1fr; }
        }

        .question-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 30px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .q-number { font-size: 14px; font-weight: 800; color: #6366f1; margin-bottom: 10px; }
        .q-text { font-size: 17px; font-weight: 700; color: #0f172a; line-height: 1.5; margin-bottom: 25px; }

        .variants-list { display: flex; flex-direction: column; gap: 12px; }
        .variant-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }
        .variant-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .variant-btn.selected {
            background: #eef2ff;
            border-color: #6366f1;
            color: #4338ca;
            font-weight: 700;
        }
        .v-badge {
            background: white;
            border: 1.5px solid #cbd5e1;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }
        .variant-btn.selected .v-badge {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
        }
        .btn-ctrl {
            background: #f1f5f9;
            border: none;
            padding: 11px 22px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            color: #475569;
        }
        .btn-ctrl:disabled { opacity: 0.5; cursor: not-allowed; }

        .sidebar-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            height: fit-content;
        }
        .sidebar-title { font-size: 15px; font-weight: 800; color: #1e1b4b; margin-bottom: 16px; }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }
        .palette-btn {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            padding: 10px 0;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: 0.15s;
        }
        .palette-btn.active { border-color: #6366f1; background: #6366f1; color: white; }
        .palette-btn.answered { background: #dcfce7; border-color: #86efac; color: #166534; }
        .palette-btn.answered.active { background: #16a34a; border-color: #16a34a; color: white; }

        .btn-finish {
            width: 100%;
            background: #ef4444;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-finish:hover { background: #dc2626; }

        /* Natija Modali */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 35px;
            max-width: 440px;
            width: 90%;
            text-align: center;
        }
        .modal-score { font-size: 48px; font-weight: 800; color: #4f46e5; margin: 15px 0; }
        .btn-modal {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header class="test-header">
        <div class="test-title" id="testNomi">Onlayn Test</div>
        <div class="timer-badge">
            ⏳ <span id="timerDisplay">30:00</span>
        </div>
    </header>

    <div class="main-wrapper" id="testBox">
        <!-- SAVOL VA VARIANTLAR -->
        <div class="question-card">
            <div>
                <div class="q-number" id="qNumber">Savol 1 / 25</div>
                <div class="q-text" id="qText">Savol matni yuklanmoqda...</div>
                <div class="variants-list" id="variantsBox"></div>
            </div>

            <div class="nav-controls">
                <button class="btn-ctrl" id="btnPrev" onclick="otishSavolga(joriyIndex - 1)">⬅️ Oldingisi</button>
                <button class="btn-ctrl" id="btnNext" onclick="otishSavolga(joriyIndex + 1)">Keyingisi ➡️</button>
            </div>
        </div>

        <!-- YON PALITRA (1 DAN 25 GACHA) -->
        <div class="sidebar-card">
            <div class="sidebar-title">Savollar xaritasi:</div>
            <div class="palette-grid" id="paletteGrid"></div>
            <button class="btn-finish" onclick="yakunlashTestTasdiq()">🛑 Testni Yakunlash</button>
        </div>
    </div>

    <!-- NATIJA OYNASI -->
    <div class="modal-overlay" id="resultModal" style="display: none;">
        <div class="modal-content">
            <h2>🎉 Test Yakunlandi!</h2>
            <p style="color: #64748b; font-size: 14px; margin-top: 6px;">Sizning to‘plagan umumiy balingiz:</p>
            <div class="modal-score" id="resBall">0</div>
            <p id="resVaqt" style="font-size: 14px; font-weight: 700; color: #334155; margin-bottom: 20px;">Sarflangan vaqt: 0 daq</p>
            <a href="/kabinet" class="btn-modal">Kabinetga Qaytish</a>
        </div>
    </div>

    <script>
        const oquvchiData = JSON.parse(sessionStorage.getItem("user_info") || "null");
        if (!oquvchiData || !oquvchiData.id) {
            alert("Iltimos, avval tizimga kiring!");
            window.location.href = "/login";
        }

        const testId = window.location.pathname.split("/").pop();
        let urinishId = null;
        let savollar = [];
        let joriyIndex = 0;
        let javoblar = {};
        let qolganSoniya = 30 * 60;
        let timerInterval = null;

        async function boshlashTest() {
            try {
                const res = await fetch(`/api/test/boshlash/${testId}?oquvchi_id=${oquvchiData.id}`);
                const data = await res.json();

                if (!res.ok) {
                    alert(data.xatolik || "Xatolik yuz berdi!");
                    window.location.href = "/kabinet";
                    return;
                }

                urinishId = data.urinish_id;
                savollar = data.savollar;

                yaratishPalitra();
                boshlashTimer();
                korsatSavol(0);
            } catch (err) {
                alert("Server bilan aloqa uzildi!");
            }
        }

        function yaratishPalitra() {
            const grid = document.getElementById("paletteGrid");
            grid.innerHTML = savollar.map((_, i) => `
                <button class="palette-btn ${i === 0 ? 'active' : ''}" id="pal_${i}" onclick="otishSavolga(${i})">
                    ${i + 1}
                </button>
            `).join('');
        }

        function korsatSavol(index) {
            joriyIndex = index;
            const s = savollar[index];

            document.getElementById("qNumber").innerText = `Savol ${index + 1} / ${savollar.length}`;
            document.getElementById("qText").innerText = s.savol_matni;

            const tanlanganJavob = javoblar[String(s.savol_id)];

            const vBox = document.getElementById("variantsBox");
            vBox.innerHTML = s.variantlar.map(v => `
                <div class="variant-btn ${tanlanganJavob === v.kalit ? 'selected' : ''}" onclick="tanlashVariant('${s.savol_id}', '${v.kalit}')">
                    <span class="v-badge">${v.kalit}</span>
                    <span>${v.matn}</span>
                </div>
            `).join('');

            document.getElementById("btnPrev").disabled = index === 0;
            document.getElementById("btnNext").disabled = index === savollar.length - 1;

            document.querySelectorAll(".palette-btn").forEach((btn, i) => {
                btn.classList.remove("active");
                if (i === index) btn.classList.add("active");
            });
        }

        function tanlashVariant(savolId, kalit) {
            javoblar[String(savolId)] = kalit;
            document.getElementById(`pal_${joriyIndex}`).classList.add("answered");
            korsatSavol(joriyIndex);
        }

        function otishSavolga(index) {
            if (index >= 0 && index < savollar.length) {
                korsatSavol(index);
            }
        }

        function boshlashTimer() {
            timerInterval = setInterval(() => {
                qolganSoniya--;
                if (qolganSoniya <= 0) {
                    clearInterval(timerInterval);
                    yakunlashTest();
                    return;
                }

                const m = Math.floor(qolganSoniya / 60);
                const s = qolganSoniya % 60;
                document.getElementById("timerDisplay").innerText = 
                    `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
            }, 1000);
        }

        function yakunlashTestTasdiq() {
            const jami = savollar.length;
            const belgilangan = Object.keys(javoblar).length;
            if (confirm(`Siz ${jami} ta savoldan ${belgilangan} tasini belgiladingiz. Testni rostdan ham yakunlamoqchimisiz?`)) {
                yakunlashTest();
            }
        }

        async function yakunlashTest() {
            clearInterval(timerInterval);
            try {
                const res = await fetch("/api/test/topshirish", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        urinish_id: urinishId,
                        javoblar: javoblar
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById("resBall").innerText = `${data.ball} ball`;
                    const daq = Math.floor(data.sarflangan_soniya / 60);
                    const son = data.sarflangan_soniya % 60;
                    document.getElementById("resVaqt").innerText = `Sarflangan vaqt: ${daq} daqiqa ${son} soniya`;
                    document.getElementById("resultModal").style.display = "flex";
                } else {
                    alert(data.xatolik || "Xatolik yuz berdi!");
                }
            } catch (e) {
                alert("Natijani yuborishda xatolik yuz berdi!");
            }
        }

        boshlashTest();
    </script>
</body>
</html>
