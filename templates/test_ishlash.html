<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onlayn Test Sinovi | Qorako‘l Ziyo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        const userInfo = JSON.parse(sessionStorage.getItem("user_info") || "null");
        if (!userInfo || !userInfo.id) {
            window.location.href = "/login";
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; padding-bottom: 50px; }
        
        .header { background: white; border-bottom: 1px solid #e2e8f0; padding: 14px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; }
        .logo { font-weight: 800; font-size: 17px; color: #4338ca; }
        .timer-badge { background: #fee2e2; color: #b91c1c; padding: 8px 18px; border-radius: 12px; font-weight: 800; font-size: 16px; border: 1.5px solid #fca5a5; }

        .container { max-width: 950px; margin: 25px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 280px; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .test-box { background: white; border-radius: 20px; padding: 25px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .savol-raqam { font-size: 13px; font-weight: 800; color: #6366f1; text-transform: uppercase; margin-bottom: 8px; }
        .savol-matn { font-size: 17px; font-weight: 700; color: #0f172a; line-height: 1.5; margin-bottom: 20px; }

        .variant-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .variant-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 14px; font-weight: 600; }
        .variant-item:hover { border-color: #c7d2fe; background: #f5f3ff; }
        .variant-item.tanlangan { border-color: #4f46e5; background: #eef2ff; color: #4338ca; font-weight: 700; }
        .variant-harf { width: 30px; height: 30px; border-radius: 8px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-weight: 800; }
        .variant-item.tanlangan .variant-harf { background: #4f46e5; color: white; }

        .nav-buttons { display: flex; justify-content: space-between; align-items: center; }
        .btn-nav { padding: 10px 18px; border-radius: 10px; border: 1.5px solid #cbd5e1; background: white; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-nav:hover { background: #f8fafc; }

        .sidebar { background: white; border-radius: 20px; padding: 20px; border: 1px solid #e2e8f0; height: fit-content; }
        .map-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; }
        .map-btn { padding: 8px 0; border-radius: 8px; border: 1.5px solid #e2e8f0; background: #f8fafc; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; }
        .map-btn.belgilangan { background: #10b981; color: white; border-color: #059669; }
        .map-btn.faol { border-color: #4f46e5; box-shadow: 0 0 0 2px #c7d2fe; }

        .btn-finish { width: 100%; margin-top: 20px; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; }
        .btn-finish:hover { background: #dc2626; }

        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-box { background: white; border-radius: 24px; padding: 35px; max-width: 500px; width: 90%; text-align: center; }
        .modal-ball { font-size: 42px; font-weight: 900; color: #4f46e5; margin: 15px 0; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">⚡ Test Sinovi</div>
        <div class="timer-badge" id="qolganVaqt">⏳ 30:00</div>
    </header>

    <div class="container">
        <div class="test-box">
            <div class="savol-raqam" id="savolRaqamiKo'rsatkich">Savol 1 / 25</div>
            <div class="savol-matn" id="savolMatniJoyi">Savol yuklanmoqda...</div>

            <div class="variant-list" id="variantlarJoyi"></div>

            <div class="nav-buttons">
                <button class="btn-nav" onclick="oldingiSavol()">⬅️ Oldingisi</button>
                <button class="btn-nav" onclick="keyingiSavol()">Keyingisi ➡️</button>
            </div>
        </div>

        <div class="sidebar">
            <div style="font-weight: 800; font-size: 14px; color: #1e1b4b;">Savollar xaritasi:</div>
            <div class="map-grid" id="savollarXaritasi"></div>
            <button class="btn-finish" onclick="yakunlashTest()">⭕ Testni Yakunlash</button>
        </div>
    </div>

    <!-- YAKUNIY NATIJA MODALI -->
    <div class="modal" id="finishModal">
        <div class="modal-box">
            <h2>🎉 Test Yakunlandi!</h2>
            <p style="color: #64748b; font-size: 14px; margin-top: 5px;">Sizning to‘plagan umumiy balingiz:</p>
            <div class="modal-ball" id="yakuniyBall">0 ball</div>
            
            <div style="background: #f8fafc; border-radius: 12px; padding: 14px; margin-bottom: 20px; font-size: 14px; font-weight: 700; color: #334155;">
                <p>⏱️ Sarflangan vaqt: <span id="yakuniyVaqt" style="color: #4f46e5;">0 daqiqa</span></p>
                <p style="margin-top: 6px;">🏆 Reytingdagi o‘rningiz: <span id="yakuniyOrin" style="color: #16a34a;">1-o‘rin</span></p>
            </div>

            <button onclick="window.location.href='/kabinet'" style="background: #4f46e5; color: white; border: none; padding: 12px 28px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; width: 100%;">
                Kabinetga Qaytish
            </button>
        </div>
    </div>

    <script>
        const testId = window.location.pathname.split("/").pop();
        let urinishId = null;
        let savollar = [];
        let joriyIndeks = 0;
        let javoblar = {};
        let umumiySoniya = 1800;
        let taymerInterval = null;
        let holatTekshiruvInterval = null;

        async function yuklashSavollar() {
            try {
                const res = await fetch(`/api/test/boshlash/${testId}?oquvchi_id=${userInfo.id}`);
                const data = await res.json();
                if (!res.ok) {
                    alert(data.xatolik || "Xatolik!");
                    window.location.href = "/kabinet";
                    return;
                }

                urinishId = data.urinish_id;
                savollar = data.savollar || [];

                boshlashTaymer();
                boshlashHolatTekshiruv();
                chizishXarita();
                korsatSavol(0);
            } catch(e) {
                alert("Savollarni yuklashda xatolik!");
                window.location.href = "/kabinet";
            }
        }

        // Jonli ravishda o'quvchi chetlatilganligini tekshirib turish
        function boshlashHolatTekshiruv() {
            holatTekshiruvInterval = setInterval(async () => {
                if (!urinishId) return;
                try {
                    const res = await fetch(`/api/test/holat_tekshirish/${urinishId}`);
                    const data = await res.json();
                    if (data.holat === "chetlatildi") {
                        clearInterval(taymerInterval);
                        clearInterval(holatTekshiruvInterval);
                        alert("⚠️ Diqqat! Siz o‘qituvchi tomonidan testdan chetlatildingiz. Sinovingiz bekor qilindi!");
                        window.location.href = "/kabinet";
                    }
                } catch(e) {}
            }, 3000);
        }

        function boshlashTaymer() {
            taymerInterval = setInterval(() => {
                umumiySoniya--;
                if (umumiySoniya <= 0) {
                    clearInterval(taymerInterval);
                    clearInterval(holatTekshiruvInterval);
                    yakunlashTest(true);
                    return;
                }
                const m = Math.floor(umumiySoniya / 60);
                const s = umumiySoniya % 60;
                document.getElementById("qolganVaqt").innerText = `⏳ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }, 1000);
        }

        function chizishXarita() {
            const container = document.getElementById("savollarXaritasi");
            container.innerHTML = savollar.map((_, i) => `
                <div class="map-btn ${i === 0 ? 'faol' : ''}" id="mapBtn_${i}" onclick="korsatSavol(${i})">${i + 1}</div>
            `).join('');
        }

        function korsatSavol(index) {
            if (index < 0 || index >= savollar.length) return;
            joriyIndeks = index;

            document.querySelectorAll(".map-btn").forEach((b, i) => {
                b.classList.toggle("faol", i === index);
            });

            const s = savollar[index];
            document.getElementById("savolRaqamiKo'rsatkich").innerText = `Savol ${index + 1} / ${savollar.length}`;
            document.getElementById("savolMatniJoyi").innerText = s.savol_matni;

            const vBox = document.getElementById("variantlarJoyi");
            const tanlanganHarf = javoblar[s.savol_id];

            vBox.innerHTML = s.variantlar.map(v => `
                <div class="variant-item ${tanlanganHarf === v.kalit ? 'tanlangan' : ''}" onclick="tanlashJavob(${s.savol_id}, '${v.kalit}', ${index})">
                    <div class="variant-harf">${v.kalit}</div>
                    <div>${v.matn}</div>
                </div>
            `).join('');
        }

        function tanlashJavob(savolId, harf, index) {
            javoblar[savolId] = harf;
            document.getElementById(`mapBtn_${index}`).classList.add("belgilangan");
            korsatSavol(index);
        }

        function oldingiSavol() { if (joriyIndeks > 0) korsatSavol(joriyIndeks - 1); }
        function keyingiSavol() { if (joriyIndeks < savollar.length - 1) korsatSavol(joriyIndeks + 1); }

        async function yakunlashTest(avto = false) {
            if (!avto && !confirm("Haqiqatan ham testni yakunlamoqchimisiz?")) return;
            clearInterval(taymerInterval);
            clearInterval(holatTekshiruvInterval);

            try {
                const res = await fetch("/api/test/topshirish", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        urinish_id: urinishId,
                        javoblar: javoblar
                    })
                });
                const d = await res.json();
                if (res.ok) {
                    document.getElementById("yakuniyBall").innerText = `${d.ball} ball`;
                    document.getElementById("yakuniyVaqt").innerText = d.vaqt_matn || `${d.sarflangan_soniya} soniya`;
                    document.getElementById("yakuniyOrin").innerText = `${d.orin}-o‘rin`;
                    document.getElementById("finishModal").style.display = "flex";
                } else {
                    alert(d.xatolik || "Xatolik yuz berdi!");
                }
            } catch(e) {
                alert("Natijani saqlashda xatolik!");
            }
        }

        yuklashSavollar();
    </script>
</body>
</html>
