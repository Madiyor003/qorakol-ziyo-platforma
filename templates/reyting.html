<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respublika Reyting Doskasi | Qorako‘l Ziyo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; padding-bottom: 60px; }
        .header { background: white; border-bottom: 1px solid #e2e8f0; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; }
        .logo { font-weight: 800; font-size: 18px; color: #4338ca; }
        .btn-kabinet { background: #eef2ff; color: #4338ca; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; text-decoration: none; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        
        .filter-box { background: white; border-radius: 18px; padding: 20px; border: 1px solid #e2e8f0; display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 25px; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; font-weight: 700; color: #64748b; }
        select { padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; font-weight: 700; color: #334155; outline: none; background: white; }

        /* Reyting Jadvali */
        .table-card { background: white; border-radius: 20px; border: 1px solid #e2e8f0; overflow-x: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        table { width: 100%; border-collapse: collapse; min-width: 700px; font-size: 14px; }
        th { background: #f1f5f9; color: #475569; padding: 14px 16px; text-align: left; font-weight: 700; }
        td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; }
        
        .medal-badge { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
        .top-1 { background: #fef08a; color: #854d0e; }
        .top-2 { background: #e2e8f0; color: #334155; }
        .top-3 { background: #fed7aa; color: #9a3412; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">🏆 Respublika Reyting Doskasi</div>
        <a href="/kabinet" class="btn-kabinet">🎓 Kabinetim</a>
    </header>

    <div class="container">

        <!-- FILTRLAR -->
        <div class="filter-box">
            <div class="filter-group">
                <label>Fan:</label>
                <select id="fanFilter" onchange="yuklashReyting()">
                    <option value="Informatika">Informatika</option>
                    <option value="Matematika">Matematika</option>
                    <option value="Fizika">Fizika</option>
                    <option value="Kimyo">Kimyo</option>
                    <option value="Biologiya">Biologiya</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sinov turi:</label>
                <select id="turFilter" onchange="tekshirTur(); yuklashReyting()">
                    <option value="kunlik">Kunlik test</option>
                    <option value="haftalik">Haftalik test</option>
                    <option value="oylik">Oylik olimpiada</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sinf:</label>
                <select id="sinfFilter" onchange="yuklashReyting()">
                    <option value="barchasi">Barcha sinflar</option>
                    <option value="5">5-sinf</option>
                    <option value="6">6-sinf</option>
                    <option value="7">7-sinf</option>
                    <option value="8">8-sinf</option>
                    <option value="9">9-sinf</option>
                    <option value="10">10-sinf</option>
                    <option value="11">11-sinf</option>
                </select>
            </div>
            <div class="filter-group" id="oyQutisi">
                <label>Oy:</label>
                <select id="oyFilter" onchange="yuklashReyting()">
                    <option value="Oktyabr">Oktyabr</option>
                    <option value="Noyabr">Noyabr</option>
                    <option value="Dekabr">Dekabr</option>
                </select>
            </div>
            <div class="filter-group" id="haftaQutisi" style="display: none;">
                <label>Hafta:</label>
                <select id="haftaFilter" onchange="yuklashReyting()">
                    <option value="1">1-hafta</option>
                    <option value="2">2-hafta</option>
                    <option value="3">3-hafta</option>
                    <option value="4">4-hafta</option>
                </select>
            </div>
        </div>

        <!-- JADVAL -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th style="width: 70px;">O‘rin</th>
                        <th>O‘quvchi F.I.O</th>
                        <th>Sinf</th>
                        <th>Maktab & Hudud</th>
                        <th>Ball</th>
                        <th>Sarflangan Vaqt</th>
                    </tr>
                </thead>
                <tbody id="reytingTableBody">
                    <tr><td colspan="6" style="padding: 20px; text-align: center; color: #94a3b8;">Reyting yuklanmoqda...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        function tekshirTur() {
            const tur = document.getElementById("turFilter").value;
            document.getElementById("haftaQutisi").style.display = tur === "haftalik" ? "flex" : "none";
        }

        async function yuklashReyting() {
            const fan = document.getElementById("fanFilter").value;
            const tur = document.getElementById("turFilter").value;
            const sinf = document.getElementById("sinfFilter").value;
            const oy = document.getElementById("oyFilter").value;
            const hafta = document.getElementById("haftaFilter").value;

            const url = `/api/reyting?fan=${encodeURIComponent(fan)}&bosqich_turi=${tur}&oy_nomi=${oy}&hafta_raqami=${hafta}&sinf=${sinf}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                const tbody = document.getElementById("reytingTableBody");

                if (!data.reyting || data.reyting.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="padding: 25px; text-align: center; color: #94a3b8;">Hozircha ushbu sinov bo‘yicha natijalar mavjud emas.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.reyting.map(r => {
                    let medal = `<span style="font-weight: 800; color: #64748b; margin-left: 8px;">#${r.orin}</span>`;
                    if (r.orin === 1) medal = `<span class="medal-badge top-1">🥇 1</span>`;
                    else if (r.orin === 2) medal = `<span class="medal-badge top-2">🥈 2</span>`;
                    else if (r.orin === 3) medal = `<span class="medal-badge top-3">🥉 3</span>`;

                    const daq = Math.floor(r.sarflangan_soniya / 60);
                    const son = r.sarflangan_soniya % 60;

                    return `
                        <tr>
                            <td>${medal}</td>
                            <td style="font-weight: 700; color: #1e1b4b;">${r.fio}</td>
                            <td>${r.sinf}-sinf</td>
                            <td style="color: #64748b;">${r.maktab} (${r.viloyat})</td>
                            <td><b style="color: #16a34a; font-size: 15px;">${r.ball} ball</b></td>
                            <td style="color: #4338ca; font-weight: 600;">⏱️ ${daq} daq ${son} son</td>
                        </tr>
                    `;
                }).join('');
            } catch(e) {
                console.error(e);
            }
        }

        tekshirTur();
        yuklashReyting();
    </script>
</body>
</html>
