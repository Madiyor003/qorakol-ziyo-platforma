<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respublika Olimpiada Markazi | Kirish</title>
    <meta name="google-site-verification" content="bYZg7FJ1zwWVIU9kedlnrHHg629pm6QdwG59gWEjKVQ" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* INFORMATIKA VA TEXNOLOGIYA MAVZUSIDAGI ZAMONAVIY FON */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(10, 15, 30, 0.92), rgba(15, 23, 42, 0.94)), 
                        url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 42px 36px;
            max-width: 490px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 40px rgba(37, 99, 235, 0.2);
            text-align: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eff6ff;
            color: #2563eb;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            border: 1px solid #bfdbfe;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        p.desc {
            font-size: 13.5px;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .roles-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .role-btn {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border-radius: 16px;
            text-decoration: none;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .role-btn:hover {
            border-color: #2563eb;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -6px rgba(37, 99, 235, 0.15);
        }

        .role-btn .icon {
            font-size: 30px;
            margin-right: 16px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #f8fafc;
            flex-shrink: 0;
        }

        .role-btn.student:hover .icon { background: #eff6ff; }
        .role-btn.teacher:hover .icon { background: #fdf2f8; }

        .role-btn .text { text-align: left; }
        .role-btn .text strong { display: block; font-size: 15.5px; color: #0f172a; font-weight: 800; }
        .role-btn .text span { font-size: 12.5px; color: #64748b; font-weight: 500; }

        .arrow { margin-left: auto; color: #94a3b8; font-weight: 700; transition: transform 0.2s; }
        .role-btn:hover .arrow { transform: translateX(4px); color: #2563eb; }

        .admin-link-box {
            margin-top: 26px;
            padding-top: 18px;
            border-top: 1px dashed #e2e8f0;
        }
        .admin-link {
            font-size: 12.5px;
            color: #64748b;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .admin-link:hover { color: #dc2626; }
    </style>
</head>
<body>

    <div class="main-card">
        <span class="hero-badge">💻 Informatika & Fan Olimpiadalari</span>
        <h1>Respublika Ta’lim Platformasi</h1>
        <p class="desc">Natijalarni kuzatish, reytinglar va olimpiada nazorati tizimi</p>

        <div class="roles-grid">
            <!-- O'QUVCHI -->
            <a href="/login" class="role-btn student">
                <div class="icon">👨‍🎓</div>
                <div class="text">
                    <strong>Men O‘quvchiman</strong>
                    <span>Shaxsiy kabinet, reyting va natijalarim</span>
                </div>
                <div class="arrow">→</div>
            </a>

            <!-- O'QITUVCHI -->
            <a href="/oqituvchi-login" class="role-btn teacher">
                <div class="icon">👩‍🏫</div>
                <div class="text">
                    <strong>Men O‘qituvchiman</strong>
                    <span>Sinf natijalari va Excel orqali ball yuklash</span>
                </div>
                <div class="arrow">→</div>
            </a>
        </div>

        <div class="admin-link-box">
            <a href="/admin-login" class="admin-link">🔐 Super Admin Markaziga kirish</a>
        </div>
    </div>

</body>
</html>
